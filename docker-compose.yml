name: protanki-wiki-admin

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-wiki}
  POSTGRES_SSLMODE: disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
    ports:
      # Host port only, so a local psql can reach it without clashing with a
      # postgres already running on 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wiki}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    environment:
      <<: *postgres-env
      LOCALES: ${LOCALES:-ru,ua,en,br}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-500}
      INITIAL_LOOKBACK: ${INITIAL_LOOKBACK:-720h}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Run on demand, never as part of `up`: schema changes are a decision, not a
  # side effect of starting the app.
  #   docker compose --profile migrations run --rm migrator          # up
  #   docker compose --profile migrations run --rm migrator down 1
  #   docker compose --profile migrations run --rm migrator version
  migrator:
    image: migrate/migrate:v4.18.1
    profiles: ["migrations"]
    volumes:
      # Writable so `make migrate-create` can drop new files here.
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wiki}?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: seed
    profiles: ["seed"]
    environment:
      <<: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
